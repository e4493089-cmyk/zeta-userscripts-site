name: Patch userscript install link behavior

on:
  push:
    paths:
      - '.github/workflows/patch-install-target.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch install links and cache bust
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('site.js')
          s = p.read_text(encoding='utf-8')
          old = """      primary.href=url;\n      primary.setAttribute('data-userscript-install','1');"""
          new = """      primary.href=url;\n      primary.target='_blank';\n      primary.rel='noopener';\n      primary.setAttribute('data-userscript-install','1');"""
          if old not in s:
              raise SystemExit('site.js install anchor block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          for name in ('index.html', 'scripts.html'):
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s2, n = re.subn(r'site\\.js\\?v=[0-9.]+', 'site.js?v=7.8.1', s)
              if not n:
                  raise SystemExit(f'{name}: site.js cache-bust reference not found')
              p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site.js index.html scripts.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: keep site open during userscript install"
          git push
