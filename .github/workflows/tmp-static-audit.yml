name: Temporary static audit

on:
  push:
    paths:
      - '.github/workflows/tmp-static-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply behavior-neutral cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ['zeta-ooc-hide.bookmarklet.txt', 'zeta-user-mask.bookmarklet.txt']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              if not s.endswith('\n'):
                  p.write_text(s + '\n', encoding='utf-8')

          readme = '\n'.join([
              'Zeta Tools site',
              '',
              '- 5 public Zeta userscript installers',
              '- Bookmarklet loaders',
              '- Theme Maker: user/character bubble colors, chat background, font size, optional bubble border color/width',
              '- Live preview',
              '- Tampermonkey install / bookmarklet copy / .user.js download / reset',
              '',
              'Script version labels are read from live userscript metadata where applicable.',
              'Deploy the repository root with GitHub Pages.',
              ''
          ])
          Path('README.txt').write_text(readme, encoding='utf-8')
          PY
      - name: Verify JavaScript and bookmarklet syntax
        run: |
          set -e
          for f in *.js; do node --check "$f"; done
          for f in *.bookmarklet.txt; do
            python - "$f" <<'PY'
          import sys
          from pathlib import Path
          s = Path(sys.argv[1]).read_text(encoding='utf-8').strip()
          if not s.startswith('javascript:'):
              raise SystemExit('missing javascript: prefix')
          Path('/tmp/bookmarklet-check.js').write_text(s[len('javascript:'):], encoding='utf-8')
          PY
            node --check /tmp/bookmarklet-check.js
          done
          git diff --check
      - name: Commit cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.txt zeta-ooc-hide.bookmarklet.txt zeta-user-mask.bookmarklet.txt
          git commit -m "chore: tidy site metadata without behavior changes"
          git push