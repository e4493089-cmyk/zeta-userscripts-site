name: Patch live userscript install metadata

on:
  push:
    paths:
      - '.github/workflows/site-live-userscript-meta.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch site
        shell: python
        run: |
          from pathlib import Path

          # 1) site.js: real .user.js anchors + live @version fetch
          p = Path('site.js')
          s = p.read_text(encoding='utf-8')
          marker = '''function installScript(url,name){\n  const meta=platformInstallMeta();'''
          helper = '''const scriptVersionCache=new Map();\nasync function syncScriptVersion(box,url){\n  const node=box.closest('article')?.querySelector('[data-script-version]');\n  if(!node||!url)return;\n  let pending=scriptVersionCache.get(url);\n  if(!pending){\n    pending=fetch(url+(url.includes('?')?'&':'?')+'zetaVersion='+Date.now(),{cache:'no-store'})\n      .then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.text()})\n      .then(text=>text.match(/^\\s*\\/\\/\\s*@version\\s+([^\\s]+)\\s*$/m)?.[1]||null)\n      .catch(()=>null);\n    scriptVersionCache.set(url,pending);\n  }\n  const version=await pending;\n  if(version)node.textContent=`v${version}`;\n}\n\nfunction installScript(url,name){\n  const meta=platformInstallMeta();'''
          if marker not in s:
              raise SystemExit('installScript marker not found')
          s = s.replace(marker, helper, 1)

          old = '''    const primary=document.createElement('button');\n    primary.type='button';primary.className=`btn btn-primary${compact?' btn-sm':''}`;primary.textContent=meta.primary;\n    primary.addEventListener('click',()=>installScript(url,name));\n    box.appendChild(primary);'''
          new = '''    const primary=document.createElement(meta.copyFirst?'button':'a');\n    primary.className=`btn btn-primary${compact?' btn-sm':''}`;primary.textContent=meta.primary;\n    if(meta.copyFirst){\n      primary.type='button';\n      primary.addEventListener('click',()=>installScript(url,name));\n    }else{\n      primary.href=url;\n      primary.setAttribute('data-userscript-install','1');\n    }\n    box.appendChild(primary);'''
          if old not in s:
              raise SystemExit('primary action block not found')
          s = s.replace(old, new, 1)

          old = '''    if(!compact && box.dataset.bookmark){\n      const bm=document.createElement('a');bm.className='btn btn-soft';bm.href=box.dataset.bookmark;bm.textContent='북마클릿 버전';box.appendChild(bm);\n    }\n  });\n}'''
          new = '''    if(!compact && box.dataset.bookmark){\n      const bm=document.createElement('a');bm.className='btn btn-soft';bm.href=box.dataset.bookmark;bm.textContent='북마클릿 버전';box.appendChild(bm);\n    }\n    syncScriptVersion(box,url);\n  });\n}'''
          if old not in s:
              raise SystemExit('renderScriptActions tail not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 2) index.html: live version markers, latest theme URL, memory card, cache bump
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('https://raw.githubusercontent.com/e4493089-cmyk/zeta-userscripts/3ab89847565202bf241b8ba49adb3c4d8c662334/zeta-kakaotalk-theme.user.js', 'https://raw.githubusercontent.com/e4493089-cmyk/zeta-userscripts/main/zeta-kakaotalk-theme.user.js')
          s = s.replace('<span>v3.50.1</span>', '<span data-script-version>v3.50.1</span>', 1)
          s = s.replace('<span>v0.2.5</span>', '<span data-script-version>v0.2.5</span>', 1)
          s = s.replace('<span>v0.1.7</span>', '<span data-script-version>v0.1.7</span>', 2)
          s = s.replace('<span>v0.1.2</span>', '<span data-script-version>v0.1.9</span>', 1)
          full_card = '''<article class="tool-card"><div class="tool-title"><span class="tool-dot full-dot"></span><div class="tool-title-text"><h3>Fullscreen</h3><span data-script-version>v0.1.9</span></div></div><p>Zeta를 브라우저 전체화면으로 전환합니다.</p><div class="tool-actions" data-script-actions data-compact="1" data-script-name="Fullscreen" data-script-url="https://raw.githubusercontent.com/e4493089-cmyk/zeta-userscripts/main/zeta-fullscreen.user.js"></div></article>'''
          memory_card = '''\n<article class="tool-card"><div class="tool-title"><span class="tool-dot room-dot"></span><div class="tool-title-text"><h3>외장 장기기억</h3><span data-script-version>v1.5.5</span></div></div><p>방별 장기기억을 만들고 암호화 GitHub 동기화로 PC·폰에서 이어 씁니다.</p><div class="tool-actions" data-script-actions data-compact="1" data-script-name="외장 장기기억" data-script-url="https://raw.githubusercontent.com/e4493089-cmyk/zeta-memory-userscript/main/zeta-memory-tampermonkey.user.js"></div></article>'''
          if full_card not in s:
              raise SystemExit('index fullscreen card not found')
          s = s.replace(full_card, full_card + memory_card, 1)
          s = s.replace('site.js?v=7.7.3', 'site.js?v=7.8.0')
          p.write_text(s, encoding='utf-8')

          # 3) scripts.html: six scripts, live version markers, memory detail, latest theme URL, cache bump
          p = Path('scripts.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Zeta userscript 5종을 설치합니다.', 'Zeta userscript 6종을 설치합니다.')
          s = s.replace('https://raw.githubusercontent.com/e4493089-cmyk/zeta-userscripts/3ab89847565202bf241b8ba49adb3c4d8c662334/zeta-kakaotalk-theme.user.js', 'https://raw.githubusercontent.com/e4493089-cmyk/zeta-userscripts/main/zeta-kakaotalk-theme.user.js')
          s = s.replace('<a href="#full">Fullscreen</a>', '<a href="#full">Fullscreen</a><a href="#memory">장기기억</a>', 1)
          s = s.replace('<p class="sub">v3.50.1</p>', '<p class="sub" data-script-version>v3.50.1</p>', 1)
          s = s.replace('<p class="sub">v0.2.5</p>', '<p class="sub" data-script-version>v0.2.5</p>', 1)
          s = s.replace('<p class="sub">v0.1.7</p>', '<p class="sub" data-script-version>v0.1.7</p>', 2)
          s = s.replace('<p class="sub">v0.1.2</p>', '<p class="sub" data-script-version>v0.1.9</p>', 1)
          full_article = '''<article class="detail" id="full"><div class="detail-head"><div><span class="section-label">DISPLAY</span><h2>Fullscreen</h2><p class="sub" data-script-version>v0.1.9</p></div><span class="version">자동 업데이트</span></div><p class="detail-desc">Zeta 화면에 전체화면 버튼을 추가합니다. 전체화면에 들어가면 버튼은 숨겨집니다.</p><div class="detail-actions" data-script-actions data-script-name="Fullscreen" data-script-url="https://raw.githubusercontent.com/e4493089-cmyk/zeta-userscripts/main/zeta-fullscreen.user.js" data-bookmark="bookmarklets.html#full"></div><div class="notice yellow"><strong>모바일:</strong> 브라우저에 따라 휴대폰 상태바/내비게이션바까지 숨겨질 수 있습니다.</div><div class="fileline"><code>zeta-fullscreen.user.js</code><button class="btn btn-light btn-sm" data-copy="https://raw.githubusercontent.com/e4493089-cmyk/zeta-userscripts/main/zeta-fullscreen.user.js">URL 복사</button></div></article>'''
          memory_article = '''\n<article class="detail" id="memory"><div class="detail-head"><div><span class="section-label">MEMORY</span><h2>외장 장기기억</h2><p class="sub" data-script-version>v1.5.5</p></div><span class="version">자동 업데이트</span></div><p class="detail-desc">대화방별 장기기억을 만들고 암호화된 GitHub 파일로 PC와 휴대폰 사이에 동기화합니다.</p><div class="detail-actions" data-script-actions data-script-name="외장 장기기억" data-script-url="https://raw.githubusercontent.com/e4493089-cmyk/zeta-memory-userscript/main/zeta-memory-tampermonkey.user.js"></div><div class="notice blue"><strong>새 기기:</strong> 설치 후 OpenRouter 키, GitHub 토큰, 암호화 비밀번호를 기기별로 입력하고 Pull하면 됩니다.</div><div class="fileline"><code>zeta-memory-tampermonkey.user.js</code><button class="btn btn-light btn-sm" data-copy="https://raw.githubusercontent.com/e4493089-cmyk/zeta-memory-userscript/main/zeta-memory-tampermonkey.user.js">URL 복사</button></div></article>'''
          if full_article not in s:
              raise SystemExit('scripts fullscreen article not found')
          s = s.replace(full_article, full_article + memory_article, 1)
          s = s.replace('site.js?v=7.7.3', 'site.js?v=7.8.0')
          p.write_text(s, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site.js index.html scripts.html
          git commit -m "Fix direct userscript install links and live versions" || exit 0
          git push
