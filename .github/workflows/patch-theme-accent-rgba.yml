name: Patch theme accent rgba

on:
  push:
    paths:
      - '.github/workflows/patch-theme-accent-rgba.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make translucent accent colors follow Theme Maker accent
        run: |
          python - <<'PY'
          from pathlib import Path

          # Theme Maker runtime: used by downloaded userscripts and bookmarklets.
          p = Path('theme-maker.js')
          s = p.read_text(encoding='utf-8')
          old = "let css=s.slice(b,e).replace(/#[0-9a-fA-F]{6}\\b/g,rc)+custom();"
          new = "let css=s.slice(b,e).replace(/#[0-9a-fA-F]{6}\\b/g,rc);const ac=h2r(A);css=css.replace(/rgba\\(\\s*254\\s*,\\s*229\\s*,\\s*0\\s*,\\s*([0-9.]+)\\s*\\)/gi,(_,a)=>'rgba('+ac.r+','+ac.g+','+ac.b+','+a+')').replace(/rgb\\(\\s*254\\s*,\\s*229\\s*,\\s*0\\s*\\)/gi,'rgb('+ac.r+','+ac.g+','+ac.b+')')+custom();"
          if old not in s:
              raise SystemExit('theme-maker runtime target not found')
          s = s.replace(old, new, 1)
          s = s.replace('// @version      1.2.9', '// @version      1.2.10')
          p.write_text(s, encoding='utf-8')

          # Install-target userscript uses the same base CSS transformation.
          p = Path('zeta-custom-theme.user.js')
          s = p.read_text(encoding='utf-8')
          old = "let out=css.replace(/#[0-9a-fA-F]{6}\\b/g,recolorHex);"
          new = "let out=css.replace(/#[0-9a-fA-F]{6}\\b/g,recolorHex);\n    const accentRgb=hexToRgb(ACCENT);\n    out=out.replace(/rgba\\(\\s*254\\s*,\\s*229\\s*,\\s*0\\s*,\\s*([0-9.]+)\\s*\\)/gi,(_,a)=>`rgba(${accentRgb.r},${accentRgb.g},${accentRgb.b},${a})`);\n    out=out.replace(/rgb\\(\\s*254\\s*,\\s*229\\s*,\\s*0\\s*\\)/gi,`rgb(${accentRgb.r},${accentRgb.g},${accentRgb.b})`);"
          if old not in s:
              raise SystemExit('custom theme transform target not found')
          s = s.replace(old, new, 1)
          s = s.replace('// @version      1.2.9', '// @version      1.2.10', 1)
          p.write_text(s, encoding='utf-8')

          # Bust the Theme Maker JS cache.
          p = Path('theme-maker.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('theme-maker.js?v=7.7.11', 'theme-maker.js?v=7.7.12')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme-maker.js zeta-custom-theme.user.js theme-maker.html
          git commit -m "fix: make capture and delete accents follow custom theme"
          git push
