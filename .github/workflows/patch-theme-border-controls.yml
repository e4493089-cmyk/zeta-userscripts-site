name: Patch theme border controls

on:
  push:
    paths:
      - '.github/workflows/patch-theme-border-controls.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch border color and width controls
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'{path}: pattern not found: {old[:120]!r}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # theme-maker.html
          p=Path('theme-maker.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="maker-block border-option-block"><div class="maker-block-head"><b>말풍선 외곽선</b><span>선택 옵션</span></div><label class="maker-toggle" for="bubbleBorder"><input id="bubbleBorder" type="checkbox"><span class="maker-toggle-ui" aria-hidden="true"></span><span class="maker-toggle-copy"><b>외곽선 추가</b><small>말풍선 색에 맞춰 1px 선을 자동 적용</small></span></label></div>'
          new='''<div class="maker-block border-option-block"><div class="maker-block-head"><b>말풍선 외곽선</b><span>선택 옵션</span></div><label class="maker-toggle" for="bubbleBorder"><input id="bubbleBorder" type="checkbox"><span class="maker-toggle-ui" aria-hidden="true"></span><span class="maker-toggle-copy"><b>외곽선 추가</b><small>색상과 굵기를 직접 지정</small></span></label><div id="bubbleBorderControls" class="border-settings" hidden><div class="color-field"><div class="color-label"><b>외곽선 색</b><code id="borderValue">#53636C</code></div><div class="color-row simple"><button class="color-swatch color-open" type="button" data-color-open="border" aria-label="외곽선 색 선택"><span></span></button><input id="borderPicker" class="native-color-store" type="color" value="#53636C" tabindex="-1" aria-hidden="true"><input class="hex-input" id="borderHex" value="#53636C" maxlength="7" spellcheck="false" aria-label="외곽선 HEX"></div></div><div class="border-width-field"><div class="color-label"><b>외곽선 굵기</b><span><b id="borderWidthValue">1</b>px</span></div><input id="borderWidth" type="range" min="0.5" max="5" step="0.5" value="1" aria-label="외곽선 굵기"><div class="range-scale"><span>0.5</span><span>2.5</span><span>5</span></div></div></div></div>'''
          if old not in s: raise SystemExit('theme-maker.html border block missing')
          s=s.replace(old,new,1)
          s=s.replace('site.css?v=7.7.10','site.css?v=7.7.11')
          s=s.replace('theme-maker.js?v=7.7.10','theme-maker.js?v=7.7.11')
          s=s.replace('color-picker.js?v=7.7.9','color-picker.js?v=7.7.11')
          p.write_text(s,encoding='utf-8')

          # color-picker.js
          p=Path('color-picker.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("    bg: document.querySelector('#bgPicker')\n", "    bg: document.querySelector('#bgPicker'),\n    border: document.querySelector('#borderPicker')\n",1)
          s=s.replace("    bg: '채팅 배경'\n", "    bg: '채팅 배경',\n    border: '외곽선'\n",1)
          s=s.replace("    bg: document.querySelector('#bgHex')\n", "    bg: document.querySelector('#bgHex'),\n    border: document.querySelector('#borderHex')\n",1)
          p.write_text(s,encoding='utf-8')

          # theme-maker.js
          p=Path('theme-maker.js'); s=p.read_text(encoding='utf-8')
          reps=[
            ("const bubbleBorder = $('#bubbleBorder');", "const bubbleBorder = $('#bubbleBorder');\nconst bubbleBorderControls = $('#bubbleBorderControls');\nconst borderPicker = $('#borderPicker');\nconst borderHex = $('#borderHex');\nconst borderWidth = $('#borderWidth');"),
            ("function getFontSize() { return clamp(Number(fontSize?.value) || 15, 12, 20); }", "function getFontSize() { return clamp(Number(fontSize?.value) || 15, 12, 20); }\nfunction getBorderWidth() { return Math.max(.5, Math.min(5, Number(borderWidth?.value) || 1)); }"),
            ("function themeRuntime(A, O, C, F, B, U, notify) {", "function themeRuntime(A, O, C, F, B, BC, BW, U, notify) {"),
            (",meBorder=mx(A,me,.18),otherBorder=mx(O,ai,.18);return", ";return"),
            ("+(B?'\\nhtml.kt-chat-theme-active [data-sentry-component=\"ChatBubbleContainer\"].kt-me{border:1px solid '+meBorder+'!important}\\nhtml.kt-chat-theme-active [data-sentry-component=\"ChatBubbleContainer\"].kt-other{border:1px solid '+otherBorder+'!important}':'');};", "+(B?'\\nhtml.kt-chat-theme-active [data-sentry-component=\"ChatBubbleContainer\"].kt-me,html.kt-chat-theme-active [data-sentry-component=\"ChatBubbleContainer\"].kt-other{border:'+BW+'px solid '+BC+'!important}':'');};"),
            ("const A=accentPicker.value.toUpperCase(), O=otherPicker.value.toUpperCase(), C=bgPicker.value.toUpperCase(), F=getFontSize(), B=!!bubbleBorder?.checked;", "const A=accentPicker.value.toUpperCase(), O=otherPicker.value.toUpperCase(), C=bgPicker.value.toUpperCase(), F=getFontSize(), B=!!bubbleBorder?.checked, BC=(borderPicker?.value||'#53636C').toUpperCase(), BW=getBorderWidth();"),
            ("// @version      1.2.7", "// @version      1.2.8"),
            ("· 외곽선 ${B?'ON':'OFF'}", "· 외곽선 ${B?`${BC} ${BW}px`:'OFF'}"),
            ("(${themeRuntime.toString()})(${JSON.stringify(A)},${JSON.stringify(O)},${JSON.stringify(C)},${F},${B},${JSON.stringify(BASE_THEME_URL)},false);", "(${themeRuntime.toString()})(${JSON.stringify(A)},${JSON.stringify(O)},${JSON.stringify(C)},${F},${B},${JSON.stringify(BC)},${BW},${JSON.stringify(BASE_THEME_URL)},false);"),
            ("u.searchParams.set('border',bubbleBorder?.checked?'1':'0');", "u.searchParams.set('border',bubbleBorder?.checked?'1':'0');\n  u.searchParams.set('bc',(borderPicker?.value||'#53636C').slice(1).toUpperCase());\n  u.searchParams.set('bw',String(getBorderWidth()));"),
            ("function generateBookmarklet(){const A=accentPicker.value.toUpperCase(),O=otherPicker.value.toUpperCase(),C=bgPicker.value.toUpperCase(),F=getFontSize(),B=!!bubbleBorder?.checked,U=BASE_THEME_URL;return 'javascript:('+themeRuntime.toString()+')('+[A,O,C,F,B,U,true].map(v=>JSON.stringify(v)).join(',')+')';}", "function generateBookmarklet(){const A=accentPicker.value.toUpperCase(),O=otherPicker.value.toUpperCase(),C=bgPicker.value.toUpperCase(),F=getFontSize(),B=!!bubbleBorder?.checked,BC=(borderPicker?.value||'#53636C').toUpperCase(),BW=getBorderWidth(),U=BASE_THEME_URL;return 'javascript:('+themeRuntime.toString()+')('+[A,O,C,F,B,BC,BW,U,true].map(v=>JSON.stringify(v)).join(',')+')';}"),
            ("const p=new URLSearchParams(location.search),a=norm(p.get('bubble')||''),o=norm(p.get('other')||''),b=norm(p.get('bg')||''),f=Number(p.get('fs')),br=p.get('border');", "const p=new URLSearchParams(location.search),a=norm(p.get('bubble')||''),o=norm(p.get('other')||''),b=norm(p.get('bg')||''),f=Number(p.get('fs')),br=p.get('border'),bc=norm(p.get('bc')||''),bw=Number(p.get('bw'));"),
            ("if(bubbleBorder&&(br==='1'||br==='0'))bubbleBorder.checked=br==='1';", "if(bubbleBorder&&(br==='1'||br==='0'))bubbleBorder.checked=br==='1';\n  if(bc&&borderPicker){borderPicker.value=bc;if(borderHex)borderHex.value=bc}\n  if(Number.isFinite(bw)&&bw>=.5&&bw<=5&&borderWidth)borderWidth.value=String(bw);"),
            ("const accent=accentPicker.value.toUpperCase(),other=otherPicker.value.toUpperCase(),chat=bgPicker.value.toUpperCase(),fontPx=getFontSize(),borderOn=!!bubbleBorder?.checked;", "const accent=accentPicker.value.toUpperCase(),other=otherPicker.value.toUpperCase(),chat=bgPicker.value.toUpperCase(),fontPx=getFontSize(),borderOn=!!bubbleBorder?.checked,borderColor=(borderPicker?.value||'#53636C').toUpperCase(),borderPx=getBorderWidth();"),
            ("$('#accentValue').textContent=accent;$('#otherValue').textContent=other;$('#bgValue').textContent=chat;$('#fontSizeValue').textContent=fontPx;", "$('#accentValue').textContent=accent;$('#otherValue').textContent=other;$('#bgValue').textContent=chat;$('#fontSizeValue').textContent=fontPx;if(borderHex)borderHex.value=borderColor;if($('#borderValue'))$('#borderValue').textContent=borderColor;if($('#borderWidthValue'))$('#borderWidthValue').textContent=String(borderPx);if(bubbleBorderControls)bubbleBorderControls.hidden=!borderOn;"),
            ("root.setProperty('--theme-border-width',borderOn?'1px':'0px');root.setProperty('--theme-me-border',mix(accent,meText,.18));root.setProperty('--theme-other-border',mix(other,otherText,.18));", "root.setProperty('--theme-border-width',borderOn?(borderPx+'px'):'0px');root.setProperty('--theme-border-color',borderColor);"),
            ("accentPicker.addEventListener('input',render);otherPicker.addEventListener('input',render);bgPicker.addEventListener('input',render);fontSize.addEventListener('input',render);bubbleBorder?.addEventListener('input',render);", "accentPicker.addEventListener('input',render);otherPicker.addEventListener('input',render);bgPicker.addEventListener('input',render);fontSize.addEventListener('input',render);bubbleBorder?.addEventListener('input',render);borderPicker?.addEventListener('input',render);borderWidth?.addEventListener('input',render);"),
            ("bindHex(accentHex,accentPicker);bindHex(otherHex,otherPicker);bindHex(bgHex,bgPicker);", "bindHex(accentHex,accentPicker);bindHex(otherHex,otherPicker);bindHex(bgHex,bgPicker);if(borderHex&&borderPicker)bindHex(borderHex,borderPicker);"),
            ("$('#resetTheme').addEventListener('click',()=>{fontSize.value='15';if(bubbleBorder)bubbleBorder.checked=false;setColors('#FEE500','#FFFFFF','#B2C7D9')});", "$('#resetTheme').addEventListener('click',()=>{fontSize.value='15';if(bubbleBorder)bubbleBorder.checked=false;if(borderPicker)borderPicker.value='#53636C';if(borderWidth)borderWidth.value='1';setColors('#FEE500','#FFFFFF','#B2C7D9')});")
          ]
          for old,new in reps:
              if old not in s: raise SystemExit('theme-maker.js pattern missing: '+old[:100])
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # standalone install script
          p=Path('zeta-custom-theme.user.js'); s=p.read_text(encoding='utf-8')
          reps=[
            ('// @version      1.2.7','// @version      1.2.8'),
            ("if(p.has('bubble')||p.has('other')||p.has('bg')||p.has('fs')||p.has('border'))return p", "if(p.has('bubble')||p.has('other')||p.has('bg')||p.has('fs')||p.has('border')||p.has('bc')||p.has('bw'))return p"),
            ("const p=sourceParams(),ACCENT=norm(p.get('bubble'))||'#FEE500',OTHER=norm(p.get('other'))||'#FFFFFF',CHAT=norm(p.get('bg'))||'#B2C7D9',FONT_SIZE=clamp(Number(p.get('fs'))||15,12,20),BORDER=p.get('border')==='1';", "const p=sourceParams(),ACCENT=norm(p.get('bubble'))||'#FEE500',OTHER=norm(p.get('other'))||'#FFFFFF',CHAT=norm(p.get('bg'))||'#B2C7D9',FONT_SIZE=clamp(Number(p.get('fs'))||15,12,20),BORDER=p.get('border')==='1',BORDER_COLOR=norm(p.get('bc'))||'#53636C',BORDER_WIDTH=Math.max(.5,Math.min(5,Number(p.get('bw'))||1));"),
            (",meBorder=mix(ACCENT,meText,.18),otherBorder=mix(OTHER,aiText,.18);", ";"),
            ("if(BORDER)out+=`\\nhtml.kt-chat-theme-active [data-sentry-component=\"ChatBubbleContainer\"].kt-me{border:1px solid ${meBorder}!important}\\nhtml.kt-chat-theme-active [data-sentry-component=\"ChatBubbleContainer\"].kt-other{border:1px solid ${otherBorder}!important}\\n`;", "if(BORDER)out+=`\\nhtml.kt-chat-theme-active [data-sentry-component=\"ChatBubbleContainer\"].kt-me,html.kt-chat-theme-active [data-sentry-component=\"ChatBubbleContainer\"].kt-other{border:${BORDER_WIDTH}px solid ${BORDER_COLOR}!important}\\n`;"),
          ]
          for old,new in reps:
              if old not in s: raise SystemExit('zeta-custom-theme.user.js pattern missing: '+old[:100])
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # preview + controls CSS
          p=Path('css/part4.css'); s=p.read_text(encoding='utf-8')
          old='.maker-toggle-copy small{font-size:10px;color:#8a969c;font-weight:700}.maker-actions'
          new='.maker-toggle-copy small{font-size:10px;color:#8a969c;font-weight:700}.border-settings{margin-top:12px;padding:14px;border:1px solid #e2e7e9;border-radius:13px;background:#fbfcfc}.border-settings[hidden]{display:none}.border-width-field{margin-top:16px}.border-width-field .color-label>span{font-size:11px;color:#78858b}.border-width-field .color-label>span b{font-size:13px;color:#34464f}.border-width-field input[type="range"]{width:100%;accent-color:#26343c}.maker-actions'
          if old not in s: raise SystemExit('part4 toggle css anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('border:var(--theme-border-width,0px) solid var(--theme-me-border,transparent);','border:var(--theme-border-width,0px) solid var(--theme-border-color,transparent);',1)
          s=s.replace('border:var(--theme-border-width,0px) solid var(--theme-other-border,transparent);','border:var(--theme-border-width,0px) solid var(--theme-border-color,transparent);',1)
          p.write_text(s,encoding='utf-8')

          # site.css cache bust
          p=Path('site.css'); s=p.read_text(encoding='utf-8')
          if 'css/part4.css?v=7.7.10' in s: s=s.replace('css/part4.css?v=7.7.10','css/part4.css?v=7.7.11')
          elif 'css/part4.css?v=7.7.9' in s: s=s.replace('css/part4.css?v=7.7.9','css/part4.css?v=7.7.11')
          elif 'css/part4.css?v=7.7.5' in s: s=s.replace('css/part4.css?v=7.7.5','css/part4.css?v=7.7.11')
          else: raise SystemExit('site.css part4 cache ref missing')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme-maker.html theme-maker.js color-picker.js zeta-custom-theme.user.js css/part4.css site.css
          git diff --cached --quiet && exit 0
          git commit -m "feat: customize bubble border color and width"
          git push
