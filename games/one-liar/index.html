}

  const ranked=options.map(p=>{const hint=clues.find(c=>c.id===p.id)?.text||'';const matched=known.some(h=>h===hint);const generic=(AI_VAGUE[g.category]||[]).some(h=>h===hint);return {p,score:(generic?3:0)+(hint&&!matched?1.5:0)+Math.random()*1.1}}).sort((a,b)=>b.score-a.score);

function chooseVote(target){if(mode==='local'){const voter=players[localVoteIdx];if(voter&&g.phase==='vote'){doAction(voter.id,{type:'vote',target});if(g.phase==='vote'){localVoteIdx++;localVoteShown=false;render()}}}else sendMe({type:'vote',target})}
function startVote(){if(!isAuthority()||g.phase!=='clue')return;g.phase='vote';localVoteIdx=0;localVoteShown=false;publish();scheduleBots('vote')}
function afterVote(){if(mode!=='local')return;if(localVoteIdx>=players.length){tally();return}localVoteShown=true;render()}
function skipLiar(){if(!isAuthority()||g.phase!=='guess')return;finish(false,'(기회 포기)')}
function sharedLink(){if(!/^https?:/.test(location.protocol))return room;const u=new URL(location.href);u.searchParams.set('room',room);return u.toString()}
async function copyRoom(){const value=sharedLink();try{await navigator.clipboard.writeText(value);toast('초대 링크를 복사했어!')}catch{try{const t=document.createElement('textarea');t.value=value;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('초대 정보를 복사했어!')}catch{toast('방 코드: '+room)}}}
function showStatus(){return status?`<div class="msg" role="status">${E(status)}</div>`:''}
function homeHTML(){return `<div class="hero"><div class="eyebrow">MULTIPLAYER PARTY GAME</div><h1>우리 중 <em>한 명은</em><br>정답을 몰라.</h1><p>다 같은 단어를 받았는데, 딱 한 명만 모른다고?<br>수상한 힌트를 주는 라이어를 찾아내 봐.</p></div><div class="home-grid"><section class="panel"><h2>게임 시작하기</h2><p class="desc">설치도, 가입도 없이. 각자 스마트폰으로 모여봐.</p><label class="fieldlabel" for="name">내 닉네임</label><input id="name" maxlength="14" autocomplete="nickname" value="${E(nameDraft)}" placeholder="뭐라고 부를까?" /><button class="btn primary wide" style="margin-top:13px" data-action="create">✦ 새 방 만들기</button><div class="divide">또는 친구 방에 참여</div><label class="fieldlabel" for="room">6자리 방 코드</label><input id="room" maxlength="6" inputmode="text" autocapitalize="characters" spellcheck="false" value="${E(codeDraft)}" placeholder="예: K7M2AP" style="text-transform:uppercase;letter-spacing:3px" /><button class="btn secondary wide" style="margin-top:12px" data-action="join">코드로 입장하기 →</button><p class="help">온라인은 방장이 게임 화면을 켜 둬야 해. 3~12명 권장.</p><details class="offline-box"><summary>한 대의 폰으로 돌아가며 하기 (오프라인)</summary><p class="help">이름을 쉼표로 구분해서 입력해. 카드와 투표를 순서대로 비밀리에 확인해.</p><textarea id="offlineNames" placeholder="민지, 준호, 수아, 태민">민지, 준호, 수아, 태민</textarea><button class="btn secondary wide" style="margin-top:9px" data-action="local">오프라인 게임 시작</button></details>${showStatus()}</section><section class="panel pitch"><div class="eyebrow">HOW TO PLAY</div><div class="big">눈치로 속이고,<br>말 한마디로 들킨다.</div><div class="steps"><div class="step"><div class="step-idx">01</div><div><strong>비밀 단어 확인</strong><span>전원에게 같은 단어가 주어져. 단, 라이어 한 명은 카테고리만 보여.</span></div></div><div class="step"><div class="step-idx">02</div><div><strong>한 사람씩 힌트 말하기</strong><span>정답을 대놓고 말하면 라이어가 눈치챌 거야.</span></div></div><div class="step"><div class="step-idx">03</div><div><strong>누가 라이어인지 투표</strong><span>잡아내도 끝이 아니야. 라이어가 단어를 맞히면 역전!</span></div></div></div><div class="chips"><span class="chip">👥 3~12명</span><span class="chip">📱 모바일 최적화</span><span class="chip">🎲 72개 단어</span><span class="chip">🏆 라운드 점수</span></div></section></div>`}
function listPlayers(v,limit=MAX){return `<div class="list">${[...v.players].sort((a,b)=>b.score-a.score).slice(0,limit).map((p,i)=>`<div class="player-row" style="${p.online?'':'opacity:.5'}"><div class="who"><div class="circle">${E(p.name.slice(0,1))}</div><div class="name">${E(p.name)} ${p.id===v.selfId&&!v.local?'<span class="pill">나</span>':''} ${p.bot?'<span class="pill ai-badge">🤖 AI</span>':''} ${i===0&&v.round>0?'👑':''} ${!p.online?'<span class="pill">연결 끊김</span>':''}</div></div><div class="rank">${p.score}<span class="minor"> 점</span></div></div>`).join('')}</div>`}
function personName(v,id){return v.players.find(p=>p.id===id)?.name||'?'}
function roomHTML(){const v=current();if(!v)return `<section class="panel">연결 중...</section>`;const isControl=isAuthority(),isLocal=mode==='local';let main='';
if(v.phase==='lobby'){main=`<div class="big-icon">👋</div><h2>친구들 모이는 중</h2><p class="lead">방 코드를 공유해서 모두 입장하면 시작해. 이름과 점수는 오른쪽에 표시돼.</p><div class="offline-ready"><b>${v.players.length}명</b>이 대기 중이야. ${v.players.length<3?'최소 3명이 모여야 게임을 시작할 수 있어.':'준비됐어! 시작 버튼을 눌러봐.'}</div>${isControl?`<div class="ai-controls"><div class="ai-heading">🤖 AI 플레이어 <span class="pill">${botCount()} / 6</span></div><p class="help">힌트·채팅·투표·정답 추리에 참여하는 규칙 기반 봇이야. API 키 불필요.</p><div class="actions"><button class="btn secondary small" data-action="addBot" ${v.players.length>=MAX||botCount()>=6?'disabled':''}>+ AI 참가</button><button class="btn secondary small" data-action="removeBot" ${botCount()===0?'disabled':''}>− AI 제거</button></div></div><button class="btn primary wide" data-action="begin" ${v.players.length<3?'disabled':''}>게임 시작하기 →</button>`:`<div class="notice">방장이 게임을 시작하기를 기다리는 중…</div>`}`}
else if(v.phase==='clue'){
 if(isLocal&&localRevealIdx<players.length){const p=players[localRevealIdx],liar=p.id===g.liarId;main=`<div class="big-icon">🔐</div><h2>${E(p.name)} 차례야!</h2><p class="lead">${localRevealIdx+1} / ${players.length} · 다른 사람은 화면을 보지 않게 해 줘.</p><div class="dots">${players.map((_,i)=>`<i class="${i<localRevealIdx?'done':i===localRevealIdx?'current':''}"></i>`).join('')}</div>${localRevealShown?roleCard(liar,liar?null:g.word,g.category):`<div class="secretcover"><strong>${E(p.name)}에게만 보여줄게</strong><span>다른 사람이 안 보는지 확인!</span><button class="btn primary wide" data-action="localReveal">비밀 카드 열기 👀</button></div>`}${localRevealShown?`<button class="btn secondary wide" data-action="nextReveal">확인했어 · 다음 사람에게 넘기기 →</button>`:''}`}
 else if(isLocal){main=`<div class="big-icon">💬</div><h2>자, 돌아가며 힌트를!</h2><p class="lead">한 사람씩 단어를 직접 말하지 않고 설명해 줘. 라이어는 티 나지 않게 섞여야 해.</p><div class="notice">모든 플레이어가 단어 또는 라이어 역할을 확인했어. 토론이 끝나면 투표를 시작해.</div><button class="btn hot wide" data-action="startVote">모두 얘기했어! 투표 시작 →</button>`}
 else{main=`<div class="big-icon">🗣️</div><h2>이 단어를 알고 있어?</h2><p class="lead">각자 단어를 은근하게 설명해. 단어를 직접 말하거나 화면을 보여주면 안 돼.</p>${showSecret?roleCard(v.liar,v.secret,v.category)+`<button class="btn secondary small" data-action="secret">비밀 카드 숨기기</button>`:`<div class="secretcover"><strong>나만의 비밀 카드</strong><span>주변 사람이 못 보게 조심!</span><button class="btn primary" data-action="secret">🔎 비밀 카드 보기</button></div>`}${clueChat(v)}<div class="info-row">${isControl?`<button class="btn hot wide" data-action="startVote">다 얘기했어 · 투표 시작 →</button>`:`<div class="notice">방장이 힌트 시간을 끝내고 투표를 열어 줄 거야.</div>`}</div>`}}
else if(v.phase==='vote'){
 if(isLocal){const voter=players[localVoteIdx];if(!voter){main=`<h2>투표를 집계 중…</h2>`}else if(!localVoteShown){main=`<div class="big-icon">🗳️</div><h2>${E(voter.name)}, 네 차례야.</h2><p class="lead">휴대폰을 넘겨받고 자기 차례에만 투표해. 이전 투표는 보이지 않아.</p><div class="secretcover"><strong>${E(voter.name)}만 화면을 봐 줘.</strong><span>준비됐으면 투표지를 펼쳐.</span><button class="btn primary wide" data-action="localBallot">내 투표지 열기 →</button></div>`}else{main=`<div class="big-icon">🗳️</div><h2>${E(voter.name)}의 선택</h2><p class="lead">가장 수상한 한 명을 골라. 나 자신에게는 투표할 수 없어.</p>${voteOptions(v,voter.id)}`}}
 else{main=`<div class="big-icon">🗳️</div><h2>누가 거짓말을 했을까?</h2><p class="lead">의심되는 한 사람에게 투표해. 한 번 선택하면 되돌릴 수 없어.</p>${v.ownVote?`<div class="notice">✅ <b>${E(personName(v,v.ownVote))}</b>에게 투표 완료! 나머지 사람들을 기다리는 중…</div>`:voteOptions(v,v.selfId)}<div class="minor">${v.voted} / ${v.active}명 투표 완료</div>`}}
else if(v.phase==='guess'){
 if(isLocal){main=`<div class="big-icon">🎭</div><h2>라이어에게 마지막 기회!</h2><p class="lead"><b>${E(personName(v,g.liarId))}</b>에게 화면을 넘겨 줘. 토론을 듣고 정답을 추리해 봐.</p><div class="notice">라이어가 단어를 맞히면 역전 승리. 틀리면 나머지 사람들의 승리!</div>${guessForm()}`}
 else{main=`<div class="big-icon">🎭</div><h2>라이어를 잡았어!</h2><p class="lead">하지만 라이어가 단어를 알아냈다면 역전할 수 있어.</p>${v.liar?guessForm():`<div class="notice">라이어가 정답을 입력하고 있어. 조금만 기다려 줘.</div>`}${isControl&&!v.liar?`<button class="btn secondary small" style="margin-top:14px" data-action="skipGuess">라이어가 접속하지 못하면 기회 종료</button>`:''}`}}
else if(v.phase==='result'){const r=v.result, s=r.liarWins?'라이어 승리!':'시민 승리!';main=`<div class="result-box"><div class="result-icon">${r.liarWins?'😈':'🎉'}</div><div class="result-title">${s}</div><p class="result-text">${r.liarWins?(r.found?`라이어 ${E(r.liarName)}가 정답까지 맞혔어!`:`${r.votedNames.length?'투표로 지목된 건 '+r.votedNames.map(E).join(', ')+'!':'투표가 갈렸어!'} 진짜 라이어는 ${E(r.liarName)}였어.`):`${E(r.liarName)}를 찾아냈어! ${r.guess?`라이어가 제출한 답은 「${E(r.guess)}」.`:''} 완벽한 추리였어.`}</p><div class="result-word">비밀 단어는 <b>${E(r.word)}</b> · ${E(r.category)}</div><div class="result-scores"><strong>🏆 누적 점수</strong><div style="margin-top:12px">${listPlayers(v)}</div></div>${isControl?`<button class="btn primary wide" style="margin-top:23px" data-action="begin">다음 라운드 시작 →</button>`:`<div class="notice" style="margin-top:20px">방장이 다음 라운드를 시작할 수 있어.</div>`}</div>`}
return `<div class="room-head"><div><div class="roundtag">${v.round?'ROUND '+String(v.round).padStart(2,'0'):'WAITING ROOM'}</div><div class="room-title">${E(say(v.phase))}</div><div class="room-sub">${isLocal?'한 대의 폰을 돌려가며 진행':'각자 폰으로 접속해서 플레이'}</div></div>${!isLocal?`<div class="room-code"><div class="codebox">${E(room)}</div><button class="btn secondary small" data-action="copy">🔗 초대 복사</button></div>`:`<div class="codebox">OFFLINE</div>`}</div><div class="room-layout"><section class="panel scene"><div class="stage-head"><span class="phase">${E(say(v.phase))}</span><span class="tiny">${v.round?'라운드 '+v.round:'최소 3명 · 최대 12명'}</span></div>${main}${showStatus()}</section><aside class="room-sidebar">${!isLocal?chatPanel(v):''}<section class="panel sidepanel"><h3>👥 참가자 <span class="minor">${v.players.filter(p=>p.online).length} / ${MAX}명</span></h3><div class="side-note">매 라운드 정답을 들킨 라이어를 찾아봐.</div>${listPlayers(v)}<div class="sep"></div><div class="side-note">${v.phase==='lobby'?'친구를 초대해서 게임을 시작해.':v.phase==='clue'?'힌트는 너무 쉽지도, 너무 어렵지도 않게!':v.phase==='vote'?'자기 자신을 제외한 한 사람에게 투표해.':v.phase==='guess'?'라이어가 단어를 알아냈을까?':'다음 판에서는 누가 라이어일까?'}</div><button class="room-exit" data-action="exit">${isLocal?'게임 종료':'방 나가기'}</button></section></aside></div>`}
function clueChat(v){const sent=v.clues?.some(c=>c.id===v.selfId);return `<div class="info-row"><b style="font-size:14px">💬 온라인 힌트 게시판</b><p class="help" style="margin-bottom:12px">같은 장소에 있지 않아도 한 사람씩 짧은 힌트를 남길 수 있어. 한 라운드에 한 번만!</p><div class="chatlog">${v.clues?.length?v.clues.map(c=>`<div class="chatmsg ${c.id===v.selfId?'mine':''}"><div class="chatname">${E(c.name)}</div><div class="chattext">${E(c.text)}</div></div>`).join(''):'<div class="minor">아직 아무도 힌트를 남기지 않았어.</div>'}</div>${sent?'<div class="notice">내 힌트는 보냈어. 모두의 힌트를 비교해 봐.</div>':`<div class="chatentry"><input id="clueInput" maxlength="120" placeholder="내 힌트를 적어 줘" value="${E(clueDraft)}" /><button class="btn primary" data-action="clue">보내기</button></div>`}</div>`}
function chatPanel(v){const locked=v.phase==='guess';return `<section class="panel chat-panel" aria-label="공용 채팅창"><h3>💬 공용 채팅 <span class="chat-live">● 실시간</span></h3><p class="chat-help">방에 있는 모두가 보는 대화 · 힌트 게시판과 별개야</p><div id="roomChatFeed" class="chat-feed" role="log" aria-live="polite" aria-label="채팅 메시지">${chatMessageHTML(v.chat||[],v.selfId)}</div><div class="chat-compose"><input id="chatInput" maxlength="200" autocomplete="off" aria-label="채팅 입력" placeholder="${locked?'정답 추리 중에는 채팅 잠금':'메시지 입력 · Enter로 전송'}" value="${E(chatDraft)}" ${locked?'disabled':''}/><button class="btn primary small" data-action="chatSend" ${locked?'disabled':''}>전송</button></div>${locked?'<div class="chat-locked">🔒 라이어의 최종 정답 입력이 끝날 때까지 채팅 잠금</div>':''}</section>`}
function chatMessageHTML(messages,selfId){if(!messages.length)return '<div class="chat-empty">아직 메시지가 없어.<br>첫 인사를 남겨봐! 👋</div>';return messages.map(c=>{const time=new Date(c.at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});return `<div class="room-chat-msg ${c.id===selfId?'mine':''}"><div class="chat-meta"><b>${E(c.name)}</b><span>${E(time)}</span></div><div class="chat-bubble">${E(c.text)}</div></div>`}).join('')}
function updateChatFeed(messages){const feed=$('#roomChatFeed');if(!feed)return;const nearBottom=feed.scrollHeight-feed.scrollTop-feed.clientHeight<85;const v=current();feed.innerHTML=chatMessageHTML(messages,v?.selfId);if(nearBottom)feed.scrollTop=feed.scrollHeight}
function receiveChat(msg){if(mode!=='online-client'||!remote||!msg||typeof msg.text!=='string')return;remote.chat=Array.isArray(remote.chat)?remote.chat:[];remote.chat.push(msg);if(remote.chat.length>100)remote.chat.shift();updateChatFeed(remote.chat)}
function submitChat(){const field=$('#chatInput'),message=(field?.value||'').trim();if(!message||current()?.phase==='guess')return;chatDraft='';field.value='';sendMe({type:'chat',text:message})}
function roleCard(liar,word,cat){return `<div class="rolecard ${liar?'liar':''}"><div class="role-label">${liar?'쉿! 당신의 역할은':'당신의 비밀 단어는'}</div><div class="role-word">${liar?'🎭 라이어':E(word||'')}</div><div class="role-foot">카테고리: <b>${E(cat)}</b><br>${liar?'다른 사람의 힌트를 듣고 단어를 알아내. 모르는 티를 내지 마!':'라이어는 이 단어를 몰라. 직접 답을 말하지 말고 힌트를 줘!'}</div></div>`}
function voteOptions(v,selfId){const options=v.players.filter(p=>p.online&&v.roundIds.includes(p.id)&&p.id!==selfId);return `<div class="vote-list">${options.map(p=>`<button class="btn voteopt" data-action="vote" data-id="${E(p.id)}"><span>${E(p.name)}</span><span>선택 →</span></button>`).join('')}</div>`}
function guessForm(){return `<div class="fieldlabel">네가 생각하는 정답은?</div><input maxlength="50" id="guess" placeholder="단어를 적어 줘" autocomplete="off" /><button class="btn hot wide" style="margin-top:12px" data-action="guess">최종 정답 제출 →</button>`}
function render(){if(mode==='home')app.innerHTML=homeHTML();else if(mode==='creating'||mode==='joining')app.innerHTML=`<section class="panel" style="text-align:center;max-width:570px;margin:auto;padding:60px 20px"><div class="big-icon" style="margin:0 auto 15px">⌛</div><h2>${mode==='creating'?'새 방을 준비하는 중':'친구 방에 연결하는 중'}</h2><p class="lead">온라인 연결을 확인하고 있어.</p><button class="btn secondary" data-action="exit">돌아가기</button>${showStatus()}</section>`;else if(mode==='lost')app.innerHTML=`<section class="panel" style="text-align:center;max-width:570px;margin:auto;padding:60px 20px"><div class="big-icon" style="margin:0 auto 15px">📡</div><h2>방장과 연결이 끊겼어.</h2><p class="lead">방장이 화면을 닫았거나 일시적으로 연결이 불안정한 것 같아.</p><div class="actions" style="max-width:360px;margin:auto"><button class="btn primary" data-action="reconnect">다시 연결</button><button class="btn secondary" data-action="exit">처음으로</button></div></section>`;else{app.innerHTML=roomHTML();const feed=$('#roomChatFeed');if(feed)feed.scrollTop=feed.scrollHeight}}
app.addEventListener('click',ev=>{const t=ev.target.closest('[data-action]');if(!t)return;const a=t.dataset.action;
if(a==='create')createOnline();else if(a==='addBot')addBot();else if(a==='removeBot')removeBot();else if(a==='join')joinOnline();else if(a==='local')startLocal();else if(a==='exit')reset();else if(a==='copy')copyRoom();else if(a==='begin')beginRound();else if(a==='secret'){showSecret=!showSecret;render()}else if(a==='startVote')startVote();else if(a==='chatSend')submitChat();else if(a==='clue'){const clue=$('#clueInput')?.value?.trim();if(!clue){toast('힌트를 적어 줘.');return}clueDraft='';sendMe({type:'clue',clue});}else if(a==='vote')chooseVote(t.dataset.id);else if(a==='localReveal'){localRevealShown=true;render()}else if(a==='nextReveal'){localRevealIdx++;localRevealShown=false;render()}else if(a==='localBallot')afterVote();else if(a==='guess'){const guess=$('#guess')?.value||'';if(!guess.trim()){toast('정답을 입력해 줘.');return}if(mode==='local')doAction(g.liarId,{type:'guess',guess});else sendMe({type:'guess',guess});}else if(a==='skipGuess')skipLiar();else if(a==='reconnect')restartConnection()});
app.addEventListener('keydown',ev=>{if(ev.key!=='Enter')return;if(ev.target?.id==='room'){ev.preventDefault();joinOnline()}if(ev.target?.id==='chatInput'){ev.preventDefault();submitChat()}if(ev.target?.id==='clueInput'){ev.preventDefault();app.querySelector('[data-action="clue"]')?.click()}if(ev.target?.id==='guess'){ev.preventDefault();app.querySelector('[data-action="guess"]')?.click()}});
app.addEventListener('input',ev=>{if(ev.target?.id==='clueInput')clueDraft=ev.target.value;else if(ev.target?.id==='chatInput')chatDraft=ev.target.value});
const fromUrl=new URLSearchParams(location.search).get('room');if(fromUrl&&/^[A-Z2-9]{6}$/i.test(fromUrl))codeDraft=fromUrl.toUpperCase();render();
})();
</script>
</body>
</html>
