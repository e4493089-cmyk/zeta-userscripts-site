function deck(){let ts=[],i=0;for(let j=0;j<2;j++)for(let c=0;c<4;c++)for(let n=1;n<=13;n++)ts.push({id:'t'+(++i),c,n});ts.push({id:'t'+(++i),c:-1,n:0});ts.push({id:'t'+(++i),c:-1,n:0});return ts}

  if(k<=4&&plain.length){for(let n=1;n<=13;n++){if(plain.every(t=>t.n===n)&&new Set(plain.map(t=>t.c)).size===plain.length){best={type:'그룹',sum:n*k};break}}}

function getGame(){return V}

function acceptState(s){V=s;const token=s.token+':'+s.phase;if(activeToken!==token){activeToken=token;draft=null;selected.clear()}render()}
function makeGame(){const names=G.players;const all=deck(),bag=shuffle(all.map(t=>t.id));G.tiles=all;G.bag=bag;G.groups=[];G.turn=0;G.turnCount=0;G.token='r'+(++roundSeq)+'t0';G.round=roundSeq;G.phase='playing';G.winner=null;G.passCount=0;G.groupSeq=0;G.chat=G.chat.slice(-105);names.forEach(p=>{p.hand=bag.splice(0,14);p.opened=false});notice('게임 시작! 차례대로 타일을 내거나 1장 뽑아줘.');broadcast()}

function endGame(winnerId,reason=''){const scores=G.players.map(p=>({id:p.id,points:p.hand.reduce((s,x)=>{let t=G.tiles.find(t=>t.id===x);return s+(t.c===-1?30:t.n)},0)}));const winner=G.players.find(p=>p.id===winnerId);if(!winner)return;let winpoints=0;for(let p of G.players){let pts=scores.find(s=>s.id===p.id).points;if(p.id!==winnerId){p.score-=pts;winpoints+=pts}}winner.score+=winpoints;G.winner={id:winnerId,name:winner.name,reason,scores};G.phase='over';G.token+='end';notice('🏆 '+winner.name+' 승리! '+reason);broadcast()}
function checkPlay(actor,d){if(G.phase!=='playing'||G.players[G.turn]?.id!==actor)return '지금 차례가 아니야.';const p=G.players[G.turn];if(!Array.isArray(d.groups)||!Array.isArray(d.hand)||d.groups.length>50||d.hand.length>106)return '타일 데이터가 잘못됐어.';if(d.groups.some(g=>!Array.isArray(g)||g.length<3||g.length>13))return '모든 조합은 3개 이상이어야 해.';
 let prior=G.groups.flatMap(g=>g.ids),before=[...prior,...p.hand],after=[...d.hand,...d.groups.flat()],uniq=new Set(after);if(uniq.size!==after.length||before.length!==after.length||before.some(x=>!uniq.has(x)))return '타일이 사라졌거나 다른 타일이 섞였어.';const m=tileMap();if(after.some(x=>!m[x]))return '알 수 없는 타일이 있어.';if(prior.some(x=>d.hand.includes(x)))return '테이블에 있던 타일을 받침대로 가져갈 수 없어.';const played=p.hand.filter(x=>!d.hand.includes(x));if(played.length===0)return '받침대에서 타일을 1개 이상 내려놔야 해.';

 return null}

function candidateGroups(ids,m,maxCount=80){let cand=[],n=ids.length,checked=0;for(let k=3;k<=Math.min(4,n);k++){const pick=[];function gen(at){if(cand.length>450)return;if(pick.length===k){checked++;const base=pick.map(x=>m[x]);const orders=permutations(base);for(let ts of orders){const ev=evalGroup(ts);if(ev){cand.push({ids:ts.map(x=>x.id),sum:ev.sum});break}}return}for(let i=at;i<=n-(k-pick.length);i++){pick.push(ids[i]);gen(i+1);pick.pop();if(checked>90000)return}}gen(0)}const seen=new Set();cand=cand.filter(c=>{let key=[...c.ids].sort().join(',');if(seen.has(key))return false;seen.add(key);return true});return cand.sort((a,b)=>b.ids.length-a.ids.length||b.sum-a.sum).slice(0,maxCount)}
function permutations(a){if(a.length<=1)return [a];let out=[],used=Array(a.length).fill(false),cur=[];function go(){if(cur.length===a.length){out.push([...cur]);return}let keys=new Set();for(let i=0;i<a.length;i++){if(used[i])continue;const t=a[i],key=t.c+':'+t.n;if(keys.has(key))continue;keys.add(key);used[i]=true;cur.push(t);go();cur.pop();used[i]=false}}go();return out}
function chooseGroups(ids,m,need30){let c=candidateGroups(ids,m,90);let best=[],bestVal=-1;let seen=0;function search(at,chosen,taken,points){if(++seen>6000)return;let score=chosen.reduce((s,x)=>s+x.ids.length*50+x.sum,0);if((!need30||points>=30)&&score>bestVal){best=chosen.map(x=>x);bestVal=score}if(chosen.length>=4)return;for(let i=at;i<c.length;i++){let o=c[i];if(o.ids.some(x=>taken.has(x)))continue;let nset=new Set(taken);o.ids.forEach(x=>nset.add(x));search(i+1,[...chosen,o],nset,points+o.sum);if(seen>6000)return}}search(0,[],new Set(),0);return best}
function botMove(){const p=G.players[G.turn],m=tileMap();if(!p.bot&&p.connected)return;let hand=[...p.hand],groups=G.groups.map(g=>[...g.ids]),played=false;
 if(!p.opened){let chosen=chooseGroups(hand,m,true);if(chosen.length){for(let c of chosen){groups.push([...c.ids]);hand=hand.filter(x=>!c.ids.includes(x))}played=true}}
 else{
  let chosen=chooseGroups(hand,m,false);for(let c of chosen){groups.push([...c.ids]);hand=hand.filter(x=>!c.ids.includes(x));played=true}
  let moved=true,tries=0;while(moved&&tries++<25){moved=false;outer:for(let tid of hand){for(let group of groups)for(let pos=0;pos<=group.length;pos++){let temp=[...group.slice(0,pos),tid,...group.slice(pos)];if(evalGroup(temp.map(x=>m[x]))){group.splice(pos,0,tid);hand=hand.filter(x=>x!==tid);moved=played=true;break outer}}}}
  if(hand.length>=3){chosen=chooseGroups(hand,m,false);for(let c of chosen){groups.push([...c.ids]);hand=hand.filter(x=>!c.ids.includes(x));played=true}}
 }
 if(played){commitPlay(p.id,{groups,hand});if(G.phase==='playing'&&Math.random()<.25)chat(p.id,['음, 이걸로 가볼게!','괜찮은 조합이네.','다음 차례가 기대되는데?'][Math.random()*3|0])}else{drawTile(p.id)}}
function initHost(offline=false){role=offline?'offline':'creating';room=offline?'LOCAL':randCode();id=offline?'local-host':'tileclub-'+room;G={phase:'lobby',players:[{id,name:me,bot:false,connected:true,hand:[],opened:false,score:0}],tiles:[],bag:[],groups:[],turn:0,turnCount:0,token:'lobby',round:0,chat:[],winner:null};V=null;activeToken='';draft=null;conns.clear();if(offline){role='offline';broadcast();return}if(!window.Peer){role='home';toast('온라인 연결 라이브러리를 불러오지 못했어. 인터넷 연결을 확인해 줘.');render();return}render();peer=new Peer(id);wirePeer(peer);peer.on('open',()=>{if(role!=='creating')return;role='host';setRoomURL();broadcast()});peer.on('connection',conn=>{conns.set(conn.peer,conn);conn.on('data',d=>{if(d?.t==='join'){
 const name=String(d.name||'').trim().slice(0,15);if(!name){send(conn,{t:'reject',text:'닉네임이 필요해.'});return}let p=G.players.find(x=>x.id===conn.peer);if(!p){if(G.phase!=='lobby'||G.players.length>=MAX){send(conn,{t:'reject',text:'진행 중인 게임이거나 방이 꽉 찼어.'});wait(300,()=>conn.close());return}p={id:conn.peer,name,bot:false,connected:true,hand:[],opened:false,score:0};G.players.push(p)}else p.connected=true;broadcast();notice(p.name+'님이 들어왔어.');broadcast()
 }else doAction(conn.peer,d)});conn.on('close',()=>{if(conns.get(conn.peer)!==conn)return;conns.delete(conn.peer);let p=G.players.find(p=>p.id===conn.peer);if(p){if(G.phase==='lobby')G.players=G.players.filter(x=>x.id!==p.id);else p.connected=false;notice(p.name+'님의 연결이 끊어졌어.');broadcast()}})})}
function wirePeer(p){p.on('disconnected',()=>{try{p.reconnect()}catch{}});p.on('error',err=>{console.error(err);if(err?.type==='unavailable-id'&&role==='creating'){try{p.destroy()}catch{}initHost(false);return}if(role==='creating'||role==='joining'){role='home';toast('연결에 실패했어. '+(err?.type||'네트워크 확인'));render()}})}
function clientConnect(code){role='joining';room=code;render();if(!window.Peer){role='home';toast('온라인 연결 라이브러리가 없어. 인터넷을 확인해 줘.');render();return}peer=new Peer();wirePeer(peer);peer.on('open',()=>{id=peer.id;connectHost()})}
function connectHost(){const conn=peer.connect('tileclub-'+room,{reliable:true});hostConn=conn;conn.on('open',()=>send(conn,{t:'join',name:me}));conn.on('data',msg=>{if(msg?.t==='state'){
 if(role==='joining'||role==='lost'){role='client';setRoomURL()}acceptState(msg.state)}else if(msg?.t==='reject'){toast(msg.text||'입장 불가');reset()}else if(msg?.t==='error')toast(msg.text)});conn.on('close',()=>{if(role==='client'||role==='joining'){role='lost';render()}});conn.on('error',()=>{role='lost';render()})}
function reset(){clearTimeout(botTimer);try{hostConn?.close()}catch{}for(let c of conns.values())try{c.close()}catch{}conns.clear();try{peer?.destroy()}catch{}peer=null;hostConn=null;G=null;V=null;draft=null;role='home';room='';id='';activeToken='';selected.clear();gameMessage='';const url=new URL(location.href);url.searchParams.delete('room');history.replaceState(null,'',url);render()}
function setRoomURL(){if(room==='LOCAL')return;let url=new URL(location.href);url.searchParams.set('room',room);history.replaceState(null,'',url)}
function prepareDraft(){let s=getGame();if(!s||s.phase!=='playing'||s.turn!==id)return null;if(!draft){draft={hand:clone(s.hand),groups:clone(s.groups),tray:[]};selected.clear()}return draft}
function hasBoardChange(){if(!draft)return false;const s=getGame();return JSON.stringify(draft.groups)!==JSON.stringify(s.groups)||JSON.stringify(draft.hand.map(x=>x.id).sort())!==JSON.stringify(s.hand.map(x=>x.id).sort())||draft.tray.length>0}
function moveSelected(dest){let d=prepareDraft(),s=getGame();if(!d)return;const items=[...d.hand,...d.tray,...d.groups.flatMap(g=>g.tiles)].filter(t=>selected.has(t.id));if(items.length===0){toast('먼저 타일을 선택해 줘.');return}if(!s.players.find(p=>p.id===id)?.opened){const boardids=new Set(s.groups.flatMap(g=>g.tiles.map(t=>t.id)));if(items.some(t=>boardids.has(t.id))){toast('최초 등록 전에는 테이블 타일을 움직일 수 없어.');return}}
 d.hand=d.hand.filter(x=>!selected.has(x.id));d.tray=d.tray.filter(x=>!selected.has(x.id));d.groups=d.groups.map(g=>({...g,tiles:g.tiles.filter(x=>!selected.has(x.id))})).filter(g=>g.tiles.length);
 if(dest==='new'){d.groups.push({id:'draft'+Math.random().toString(36).slice(2),tiles:autoOrder(items)})}
 else if(dest==='tray'){d.tray.push(...items)}
 else{let g=d.groups.find(g=>g.id===dest);if(!g){toast('조합을 찾지 못했어.');return}g.tiles=autoOrder([...g.tiles,...items])}
 selected.clear();render()}
function reorderTile(direction){let d=prepareDraft();if(!d)return;let picks=[...selected];if(picks.length!==1){toast('움직일 타일을 하나만 선택해 줘.');return}for(let g of d.groups){let i=g.tiles.findIndex(x=>x.id===picks[0]);if(i!==-1){let dest=i+direction;if(dest<0||dest>=g.tiles.length)return;[g.tiles[i],g.tiles[dest]]=[g.tiles[dest],g.tiles[i]];render();return}}toast('테이블 타일을 골라줘.')}
function submitDraft(){let d=prepareDraft();if(!d)return;if(d.tray.length){toast('편집함에 남은 타일이 있어. 전부 조합에 넣어줘.');return}act({t:'play',groups:d.groups.map(g=>g.tiles.map(t=>t.id)),hand:d.hand.map(t=>t.id)})}
function sortedHand(hand){const h=[...hand];return h.sort((a,b)=>sortMode==='number'?(a.n||99)-(b.n||99)||a.c-b.c:a.c-b.c||a.n-b.n)}
function showChat(s){const ch=s.chat||[];return `<section class="panel chat"><div class="section-title"><h2>💬 공용 채팅</h2><span class="subtext">${ch.length}개 메시지</span></div><div class="messages" id="messages">${ch.map(m=>m.type==='system'?`<div class="msg system">${esc(m.text)}</div>`:`<div class="msg"><b>${esc(m.name)}</b>${esc(m.text)}</div>`).join('')||'<p class="help">채팅으로 전략을 이야기해 봐!</p>'}</div><form id="chatForm" class="chatinput"><input class="field" id="chatText" maxlength="250" placeholder="메시지를 입력해 줘" autocomplete="off" value="${esc(chatDraft)}"><button type="submit" class="btn sm primary">전송</button></form></section>`}
function showPlayers(s){return `<div class="players">${s.players.map(p=>`<div class="player ${s.turn===p.id?'turn':''} ${p.id===id?'you':''}"><span>${p.bot?'🤖':'👤'}</span><span><strong>${esc(p.name)}</strong>${p.id===id?' (나)':''}<div class="count">${s.phase==='lobby'?'대기 중':p.count+'장 · '+p.score+'점'}</div></span>${p.opened?'<span class="tag open">등록</span>':''}${!p.connected?'<span class="tag offline">끊김</span>':''}${s.turn===p.id&&s.phase==='playing'?'<span class="tag">차례</span>':''}</div>`).join('')}</div>`}
function home(){return `<main class="wrap"><header class="top"><div class="brand">◈ <b>타일</b>클럽 <div class="minor">친구랑 하는 숫자 조합 게임</div></div><span class="pill">2~4명 · AI 플레이 가능</span></header><section class="panel home"><div class="hero"><span class="pill">🎲 숫자 타일 파티 게임</span><h1>같은 숫자,<br>이어지는 한 수.</h1><p>1부터 13까지. 같은 숫자 3개 또는<br>같은 색깔 연속 숫자를 모아 먼저 다 내려놓자!</p></div><div class="stack"><div><label class="labels" for="nickname">닉네임</label><input id="nickname" class="field" maxlength="15" value="${esc(draftName)}" placeholder="닉네임 입력"></div><div class="two"><button class="btn primary" data-action="offline">🤖 AI 연습방 만들기</button><button class="btn" data-action="create">🌐 온라인 방 만들기</button></div><div class="hr" style="margin:0"></div><div><label class="labels" for="joincode">친구 방에 입장</label><div class="row"><input id="joincode" class="field" style="flex:1;min-width:130px" maxlength="6" value="${esc(draftRoom)}" placeholder="6자리 방 코드"><button class="btn" data-action="join">입장</button></div></div><details><summary>규칙 간단히 보기</summary>총 106장(4색 × 1~13 두 벌 + 조커 2장)을 사용해. 한 사람당 14장씩 받고 시작해. 같은 숫자·서로 다른 색 3~4장 또는 같은 색 연속 숫자 3장 이상을 내. 첫 등록은 내 타일 합계 30점 이상이 필요하고, 등록한 다음 차례부터 테이블을 재조합할 수 있어. 못 내면 1장 뽑고 차례가 끝나. 남은 타일이 없으면 승리!</details></div></section></main>`}

function board(s){let yourTurn=s.turn===id&&s.phase==='playing';let d=yourTurn?prepareDraft():null;let groups=d?.groups||s.groups,hand=yourTurn?d.hand:s.hand;let oldIds=new Set(s.groups.flatMap(g=>g.tiles.map(t=>t.id)));let opened=s.players.find(p=>p.id===id)?.opened;let allValid=groups.every(g=>evalGroup(g.tiles));const playing=s.players.find(p=>p.id===s.turn);

}>✓ 타일 내고 턴 종료</button><button class="btn" data-action="draw">${s.bag?'타일 1장 뽑고 종료':'패스하고 종료'}</button></div><p class="help">타일을 터치해 선택 → <b>새 조합</b> 또는 <b>선택 타일 여기에</b>를 눌러 이동. 기존 조합에서 일부만 떼어 새 조합을 만들 수도 있어. 잘못 놓은 타일은 '초기화'로 되돌려.</p>`:'<p class="help" style="margin-top:12px">다른 플레이어의 순서에는 내 타일을 공개하지 않아. 공용 채팅은 언제든 사용할 수 있어.</p>'}</section><aside class="sidebar">${showChat(s)}<section class="panel"><div class="section-title"><h2>📘 게임 규칙</h2></div><p class="help">• 같은 숫자, 서로 다른 색 3~4장<br>• 같은 색, 연속 숫자 3장 이상<br>• 첫 등록은 내 타일만으로 30점 이상<br>• 등록한 뒤에는 테이블 조합 재배치 가능<br>• 조커는 모든 타일 대신 사용 가능<br>• 타일을 다 내려놓으면 승리!</p><div class="notice">중간에 타일이 1~2장 남는 조합은 제출할 수 없어. 편집한 타일은 모두 유효한 조합에 넣어줘.</div></section></aside></div></main>`}
function ending(s){let win=s.winner;let rankings=[...s.players].sort((a,b)=>b.score-a.score);return `<main class="wrap">${header(s)}<section class="panel home done"><span class="pill">🏆 라운드 종료</span><h1>${esc(win.name)} 승리!</h1><p class="muted">${esc(win.reason||'모든 타일을 내려놓았어!')}</p><div class="rank">${rankings.map((p,i)=>`<div class="member"><span>${i===0?'🥇':i===1?'🥈':i===2?'🥉':'🎴'} ${esc(p.name)} ${p.bot?'🤖':''}</span><strong>${p.score>0?'+':''}${p.score}점</strong></div>`).join('')}</div>${role!=='client'?'<button class="btn primary" data-action="again">다시 한 판</button>':'<p class="notice">방장이 다음 판을 시작할 수 있어.</p>'}<div style="text-align:left;margin-top:18px">${showChat(s)}</div></section></main>`}
function render(){if(role==='home'){app.innerHTML=home();return}if(role==='creating'||role==='joining'){app.innerHTML=`<main class="wrap"><section class="panel home"><h2>연결 중...</h2><p class="help">${role==='creating'?'온라인 방을 만들고 있어.':'방에 입장하고 있어.'}</p><button class="btn" data-action="leave">취소</button></section></main>`;return}if(role==='lost'){app.innerHTML=`<main class="wrap"><section class="panel home"><h2>방장과 연결이 끊겼어.</h2><p>방장 브라우저가 켜져 있는지 확인해 줘.</p><button class="btn" data-action="retry">다시 연결</button><button class="btn" data-action="leave">나가기</button></section></main>`;return}let s=getGame();if(!s){app.innerHTML=home();return}const el=$('#messages');const scrollAtBottom=el?el.scrollTop+el.clientHeight>=el.scrollHeight-55:true;app.innerHTML=s.phase==='lobby'?lobby(s):s.phase==='playing'?board(s):ending(s);if(scrollAtBottom||needsScroll){let chatEl=$('#messages');if(chatEl)chatEl.scrollTop=chatEl.scrollHeight;needsScroll=false}}
function nameValue(){let inp=$('#nickname');let name=String(inp?.value||draftName||'').trim().slice(0,15);if(!name){toast('닉네임을 입력해 줘.');return null}me=name;draftName=name;try{localStorage.setItem(PK,name)}catch{}return name}
app.addEventListener('input',e=>{if(e.target?.id==='nickname')draftName=e.target.value;else if(e.target?.id==='joincode')draftRoom=e.target.value;else if(e.target?.id==='chatText')chatDraft=e.target.value});
app.addEventListener('submit',e=>{if(e.target?.id!=='chatForm')return;e.preventDefault();let text=$('#chatText')?.value?.trim();if(text){chatDraft='';needsScroll=true;act({t:'chat',text});render()}});
app.addEventListener('click',e=>{let tile=e.target.closest('[data-tile]');if(tile){if(tile.disabled)return;let key=tile.dataset.tile;if(selected.has(key))selected.delete(key);else selected.add(key);render();return}let btn=e.target.closest('[data-action]');if(!btn||btn.disabled)return;const a=btn.dataset.action;
 if(a==='offline'||a==='create'){if(!nameValue())return;initHost(a==='offline');if(a==='offline'){addBot();addBot()}return}
 if(a==='join'){if(!nameValue())return;let code=String($('#joincode')?.value||'').toUpperCase().trim().replace(/[^A-Z2-9]/g,'');if(code.length!==6){toast('방 코드 6자리를 입력해 줘.');return}clientConnect(code);return}
 if(a==='leave'){reset();return}if(a==='retry'){if(peer&&!peer.destroyed){role='joining';connectHost();render()}else reset();return}
 if(a==='copy'){let link=location.origin+location.pathname+'?room='+room;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(link).then(()=>toast('초대 링크 복사 완료!')).catch(()=>prompt('초대 링크를 복사해 줘',link))}else prompt('초대 링크를 복사해 줘',link);return}
 if(a==='start'||a==='addBot'||a==='again'){act({t:a});return}if(a==='removeBot'){act({t:a,id:btn.dataset.id});return}
 if(a==='sort'){sortMode=sortMode==='number'?'color':'number';render();return}
 if(a==='new'||a==='tray'){moveSelected(a);return}if(a==='addTo'){moveSelected(btn.dataset.id);return}
 if(a==='left'||a==='right'){reorderTile(a==='left'?-1:1);return}
 if(a==='undo'){draft=null;selected.clear();render();return}
 if(a==='submit'){submitDraft();return}
 if(a==='draw'){draft=null;selected.clear();act({t:'draw'});return}
});
render();
})();
</script></body></html>
