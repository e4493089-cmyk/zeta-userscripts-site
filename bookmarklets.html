<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FEE500"><meta name="description" content="Zeta 북마클릿을 복사합니다."><title>Zeta Tools — 북마클릿</title><link rel="stylesheet" href="site.css?v=7.5"></head><body><header class="header"><div class="wrap header-in"><a class="brand" href="index.html"><span class="logo">Z</span><span>Zeta Tools</span></a><nav class="nav" aria-label="주요 메뉴"><a href="index.html">홈</a><a href="scripts.html">스크립트</a><a class="active" href="bookmarklets.html">북마클릿</a><a href="theme-maker.html">테마 만들기</a><a class="gh" href="https://github.com/e4493089-cmyk/zeta-userscripts" target="_blank" rel="noopener">GitHub ↗</a></nav></div></header>
<main><section class="hero sub-hero"><div class="wrap"><span class="eyebrow">BOOKMARKLETS</span><h1>복사하고,<br>북마크에 붙여넣기.</h1><p>확장 프로그램 없이 필요할 때만 실행하는 방식입니다.</p></div></section>
<section class="section section-tight"><div class="wrap"><div class="guide"><div class="guide-step"><span class="guide-num">1</span><b>링크 복사</b><span>원하는 도구의 ‘링크 복사’를 누릅니다.</span></div><div class="guide-step"><span class="guide-num">2</span><b>북마크에 붙여넣기</b><span>북마크 주소(URL)를 복사한 링크로 바꿉니다.</span></div><div class="guide-step"><span class="guide-num">3</span><b>Zeta에서 실행</b><span>북마크를 누르면 적용됩니다.</span></div></div></div></section>
<section class="section"><div class="wrap"><div class="section-head"><div><h2>북마클릿</h2><p>새로고침하면 다시 실행해야 합니다.</p></div></div><div class="book-grid" id="bookmark-grid"></div></div></section>
</main><footer class="footer"><div class="wrap footer-in"><div>Zeta Tools · Zeta용 개인 도구</div><div><a href="scripts.html">스크립트</a> · <a href="bookmarklets.html">북마클릿</a> · <a href="theme-maker.html">테마 만들기</a></div></div></footer><div class="toast" id="toast"></div><script src="site.js?v=7.5"></script><script>
const B=ZetaSite.getBookmarklets();
const items=[
 {key:'both',title:'테마 + 이름 가리기',desc:'테마와 캡처 이름 가리기를 한 번에.',file:'zeta-theme-and-mask.bookmarklet.txt',recommended:true},
 {key:'theme',title:'카카오톡 테마',desc:'카카오톡 테마만 적용.',file:'zeta-theme.bookmarklet.txt'},
 {key:'mask',title:'캡처 이름 가리기',desc:'캡처 이름 가리기만 적용.',file:'zeta-user-mask.bookmarklet.txt'},
 {key:'room',title:'Room Manager',desc:'별명과 검색 기능. 별명 데이터는 브라우저에 남습니다.',file:'zeta-room-manager.bookmarklet.txt'},
 {key:'full',title:'Fullscreen',desc:'전체화면 버튼을 불러옵니다.',file:'zeta-fullscreen.bookmarklet.txt'}
];
const grid=document.getElementById('bookmark-grid');
items.forEach(x=>{
 const article=document.createElement('article'); article.className='book-card'+(x.recommended?' recommended':''); article.id=x.key;
 article.innerHTML=`<div class="book-top"><div><span class="section-label">BOOKMARKLET</span><h2>${x.title}${x.recommended?'<span class="pill">추천</span>':''}</h2><p>${x.desc}</p></div></div><div class="book-actions clean"><button class="btn btn-primary copy-link">링크 복사</button><a class="btn btn-dark drag" href="${B[x.key]}">PC: 드래그</a><a class="btn btn-soft" href="${x.file}" target="_blank">TXT 열기</a></div>`;
 article.querySelector('.copy-link').onclick=()=>ZetaSite.copyText(B[x.key],'북마클릿 링크를 복사했어요.'); grid.appendChild(article);
});
</script></body></html>
